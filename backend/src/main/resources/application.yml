spring:
    application:
        name: personal-assistant

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/personal_assistant}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        locations: classpath:db/migration

    servlet:
        multipart:
            max-file-size: 20MB
            max-request-size: 25MB

server:
    port: ${SERVER_PORT:8080}
    shutdown: graceful

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: never

assistant:
    ai:
        ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        chat-model: ${OLLAMA_CHAT_MODEL:gemma3}
        embedding-model: ${OLLAMA_EMBEDDING_MODEL:embeddinggemma}
        chat-timeout-seconds: ${OLLAMA_CHAT_TIMEOUT_SECONDS:120}
        embedding-timeout-seconds: ${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:60}

    config:
        reload-on-startup: true
